<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f16">
<meta name="robots" content="noindex,nofollow">
<title>CloFix · License sign in</title>
<link rel="icon" type="image/svg+xml" href="/clofix-mark.svg">
<link rel="stylesheet" href="/common.css">
<style>
.auth-body{min-height:100vh;display:flex;flex-direction:column}
.auth-shell{flex:1;display:grid;place-items:center;padding:36px 16px}
.auth-brand{display:block;margin:0 auto 22px;text-align:center}
.auth-brand img{height:36px;width:auto}
.auth-card{
  width:min(420px,100%);
  background:linear-gradient(155deg,#131d28,#101721);
  border:1px solid #263443;border-radius:14px;padding:32px 28px 24px;
  box-shadow:0 24px 60px #0006;
}
.auth-form{display:grid;gap:8px;margin-top:18px}
.auth-form label{margin-top:8px}
.auth-form .primary{margin-top:14px;width:100%}
.auth-card h1{margin:0;font-size:28px;letter-spacing:-.5px}
.auth-card .lead{margin:8px 0 0;color:var(--muted);font-size:13px}
.message{min-height:1.2em;margin:10px 0 0;color:var(--red);font-size:13px}
</style>
</head>
<body class="auth-body" data-page="login">
<main class="auth-shell">
  <div>
    <a class="auth-brand" href="/login" aria-label="CloFix"><img src="/clofix-logo.png" alt="CloFix"></a>
    <section class="auth-card">
      <p class="eyebrow">CloFix company</p>
      <h1>Sign in</h1>
      <p class="lead">License Server — manage keys for customer admin controllers.</p>
      <form id="login" class="auth-form" autocomplete="on">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="submit" class="primary" type="submit">Sign in</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </div>
</main>
<footer class="site-footer" role="contentinfo">
  <div class="site-footer-inner">
    <span>Powered by <strong>CloFix Infotech</strong></span>
    <span class="site-footer-sep" aria-hidden="true">·</span>
    <span>CloFix License Server</span>
    <span class="site-footer-sep" aria-hidden="true">·</span>
    <span id="footer-host">—</span>
    <span class="site-footer-sep" aria-hidden="true">·</span>
    <time id="footer-clock">—</time>
  </div>
</footer>
<script>
const $=id=>document.getElementById(id);
$('footer-host').textContent=location.host||'—';
const tick=()=>{$('footer-clock').textContent=new Date().toLocaleString();};
tick();setInterval(tick,1000);
if(sessionStorage.getItem('clofix_license_session'))location.replace('/plans');
$('login').onsubmit=async e=>{
  e.preventDefault();
  const btn=$('submit');
  btn.disabled=true;
  $('message').textContent='';
  try{
    const res=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:$('username').value.trim(),password:$('password').value}),
      cache:'no-store'
    });
    const data=await res.json();
    if(!res.ok)throw Error(data.error||('HTTP '+res.status));
    sessionStorage.setItem('clofix_license_session',data.token);
    location.replace('/plans');
  }catch(err){
    $('message').textContent=err.message||'Sign-in failed';
    $('password').focus();
    $('password').select();
  }finally{btn.disabled=false;}
};
</script>
</body>
</html>
