# CloFix company infrastructure. Deploy independently of customer FileVPS stacks.
name: clofix-license-server
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clofix_license
      POSTGRES_USER: clofix
      POSTGRES_PASSWORD: ${LICENSE_DB_PASSWORD:?set LICENSE_DB_PASSWORD in .env}
    volumes:
      - licensedb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clofix -d clofix_license"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  license:
    build: .
    environment:
      CLOFIX_LICENSE_ADMIN_USER: ${LICENSE_ADMIN_USER:?set LICENSE_ADMIN_USER}
      CLOFIX_LICENSE_ADMIN_PASSWORD: ${LICENSE_ADMIN_PASSWORD:?set LICENSE_ADMIN_PASSWORD (minimum 12 characters)}
      CLOFIX_LICENSE_DATA_DIR: /data
      CLOFIX_LICENSE_LISTEN: :8090
      CLOFIX_LICENSE_DATABASE_URL: postgres://clofix:${LICENSE_DB_PASSWORD}@db:5432/clofix_license?sslmode=disable
    ports:
      - "${LICENSE_BIND_IP:-127.0.0.1}:${LICENSE_PORT:-8090}:8090"
    volumes:
      - licensedata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  licensedata:
    name: ${LICENSE_DATA_VOLUME:-clofix-license-server-data}
  licensedb:
    name: ${LICENSE_DB_VOLUME:-clofix-license-server-db}
