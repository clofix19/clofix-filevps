<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0f16">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <title>CloFix · Register</title>
  <link rel="icon" type="image/svg+xml" href="/clofix-mark.svg">
  <script>(function(){try{var ok={dark:1,light:1,midnight:1,slate:1,contrast:1,warm:1};var saved=localStorage.getItem('cf_theme');document.documentElement.dataset.theme=ok[saved]?saved:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}})();</script>
  <link rel="stylesheet" href="/assets/app.css?v=20261102-themes">
  <link rel="stylesheet" href="/assets/refresh.css?v=20261102-footer-fixed">
</head>
<body class="auth-body" data-page="register">
  <main class="auth-shell">
    <a class="auth-brand" href="/login" aria-label="CloFix Cloud">
      <img src="/clofix-logo.png" alt="CloFix">
    </a>
    <section class="auth-card">
      <p class="eyebrow">CloFix Cloud</p>
      <h1>Create a client account</h1>
      <p class="muted">Registration creates a root user for your own account. It never creates an Admin or Partner login.</p>
      <form id="register-form" class="auth-form" autocomplete="on">
        <label for="register-account">Account name</label>
        <input id="register-account" name="account_name" autocomplete="organization" required minlength="2" maxlength="80" placeholder="Acme Cloud">
        <label for="register-email">Email</label>
        <input id="register-email" name="email" type="email" autocomplete="username" required maxlength="120">
        <label for="register-password">Password</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
        <div class="hp-field" aria-hidden="true">
          <label for="register-website">Website</label>
          <input id="register-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <p class="muted">Use at least 12 characters with no spaces.</p>
        <button class="primary" type="submit">Create account</button>
        <p class="message" id="register-message" role="status"></p>
      </form>
      <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
    </section>
  </main>
  <footer class="site-footer" role="contentinfo">
    <div class="site-footer-inner">
      <span>Powered by <strong>CloFix Infotech</strong></span>
      <span class="site-footer-sep" aria-hidden="true">·</span>
      <span>CloFix Cloud Console</span>
      <span class="site-footer-sep" aria-hidden="true">·</span>
      <span id="footer-host">—</span>
      <span class="site-footer-sep" aria-hidden="true">·</span>
      <time id="footer-clock">—</time>
    </div>
  </footer>
  <script src="/assets/auth-pages.js?v=2" defer></script>
  <script src="/assets/site-footer.js?v=1" defer></script>
</body>
</html>
